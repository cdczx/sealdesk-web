services:
  sealdesk:
    build: .
    container_name: sealdesk-web
    restart: unless-stopped
    init: true
    ports:
      - "${SEALDESK_BIND:-127.0.0.1}:${SEALDESK_PORT:-8765}:8000"
    environment:
      SEALDESK_USER: ${SEALDESK_USER:?Set in .env}
      SEALDESK_PASSWORD: ${SEALDESK_PASSWORD:?Set in .env}
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
